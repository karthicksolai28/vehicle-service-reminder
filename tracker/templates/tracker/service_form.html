{% extends 'tracker/base.html' %}
{% block content %}
  <h2>{{ title|default:"Add Service" }} - {{ vehicle.name }}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    <a href="{% url 'vehicle_detail' vehicle.pk %}">Cancel</a>
  </form>
{% endblock %}
